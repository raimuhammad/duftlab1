<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>duftlab — admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --paper:#F6F3EC; --ink:#1C1B18; --muted:#8A8578; --line:rgba(28,27,24,.14); --oxide:#E8402C;
    --display:'Space Grotesk',sans-serif; --mono:'Space Mono',monospace; --sans:'Inter',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    min-height:100vh;
  }
  a{color:inherit;}

  /* ---------- CONFIG WARNING ---------- */
  #configWarning{
    display:none; background:var(--oxide); color:#fff; font-family:var(--mono);
    font-size:12px; padding:12px 20px; text-align:center;
  }

  /* ---------- LOGIN ---------- */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-box{
    width:100%; max-width:360px; padding:40px; border:1px solid var(--line);
  }
  .login-box h1{font-family:var(--display); font-size:22px; margin-bottom:6px;}
  .login-box .sub{font-family:var(--mono); font-size:11px; color:var(--muted); margin-bottom:32px; text-transform:uppercase; letter-spacing:.05em;}
  .login-box input{
    width:100%; background:none; border:none; border-bottom:1px solid var(--line);
    outline:none; font-family:var(--sans); font-size:15px; color:var(--ink);
    padding:12px 2px; margin-bottom:18px;
  }
  .login-box input:focus{border-color:var(--ink);}
  .login-box button{
    width:100%; padding:13px 0; background:var(--ink); color:var(--paper); border:none;
    font-family:var(--mono); font-size:12px; text-transform:uppercase; letter-spacing:.08em;
    cursor:pointer; margin-top:8px;
  }
  .login-box button:hover{background:var(--oxide);}
  .login-error{font-family:var(--mono); font-size:11px; color:var(--oxide); margin-top:12px; min-height:14px;}

  /* ---------- SHELL ---------- */
  #adminShell{display:none;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 5vw; border-bottom:1px solid var(--ink);
  }
  header .logo{font-family:var(--display); font-weight:700; font-size:20px;}
  header .logo span{font-weight:400;}
  header button{
    background:none; border:1px solid var(--line); color:var(--ink);
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    padding:8px 14px; cursor:pointer;
  }
  header button:hover{border-color:var(--ink);}

  .tabs{display:flex; gap:0; padding:0 5vw; border-bottom:1px solid var(--line); overflow-x:auto;}
  .tab-btn{
    background:none; border:none; padding:16px 20px; font-family:var(--mono); font-size:12px;
    text-transform:uppercase; letter-spacing:.05em; color:var(--muted); cursor:pointer;
    border-bottom:2px solid transparent; white-space:nowrap;
  }
  .tab-btn.active{color:var(--ink); border-bottom-color:var(--oxide);}

  main{padding:40px 5vw 100px; max-width:1100px; margin:0 auto;}
  .panel{display:none;}
  .panel.active{display:block;}

  /* ---------- CATALOG CARDS ---------- */
  .cat-grid{display:flex; flex-direction:column; gap:1px; background:var(--line);}
  .cat-card{background:var(--paper); padding:24px; display:grid; grid-template-columns:160px 1fr; gap:24px;}
  @media(max-width:700px){ .cat-card{grid-template-columns:1fr;} }
  .cat-photo{width:160px; height:200px; object-fit:cover; background:#eee; border:1px solid var(--line);}
  .cat-photo-wrap{display:flex; flex-direction:column; gap:10px;}
  .cat-photo-wrap input[type=file]{font-size:11px; font-family:var(--mono);}
  .cat-fields{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .cat-fields .full{grid-column:1/-1;}
  .field-label{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:4px; display:block;}
  .cat-fields input, .cat-fields textarea{
    width:100%; background:#fff; border:1px solid var(--line); outline:none;
    font-family:var(--sans); font-size:13px; color:var(--ink); padding:8px 10px;
  }
  .cat-fields input:focus, .cat-fields textarea:focus{border-color:var(--ink);}
  .cat-fields textarea{resize:vertical; min-height:56px;}
  .cat-fields label.chk{display:flex; align-items:center; gap:8px; font-size:12px; font-family:var(--mono);}
  .cat-save-row{grid-column:1/-1; display:flex; align-items:center; gap:12px; margin-top:4px;}
  .cat-save-row button{
    background:var(--ink); color:var(--paper); border:none; padding:9px 18px;
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; cursor:pointer;
  }
  .cat-save-row button:hover{background:var(--oxide);}
  .cat-save-row .status{font-family:var(--mono); font-size:11px; color:var(--muted);}
  .cat-save-row .status.ok{color:#2E7D32;}
  .cat-save-row .status.err{color:var(--oxide);}

  /* ---------- TABLES (leads / clicks) ---------- */
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
  .toolbar button{
    background:none; border:1px solid var(--ink); color:var(--ink); padding:8px 16px;
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em; cursor:pointer;
  }
  .toolbar button:hover{background:var(--ink); color:var(--paper);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; font-family:var(--mono); font-size:10px; text-transform:uppercase;
    letter-spacing:.05em; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--ink);
  }
  td{padding:12px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:hover td{background:rgba(28,27,24,.02);}

  /* ---------- CLICK STATS BARS ---------- */
  .stat-row{margin-bottom:18px;}
  .stat-head{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;}
  .stat-head b{font-family:var(--display);}
  .stat-head span{font-family:var(--mono); font-size:11px; color:var(--muted);}
  .stat-bar-track{height:8px; background:var(--line); position:relative; overflow:hidden;}
  .stat-bar-fill{height:100%; background:var(--oxide);}
  .stat-breakdown{font-family:var(--mono); font-size:10px; color:var(--muted); margin-top:4px;}

  .empty-note{font-family:var(--mono); font-size:12px; color:var(--muted); padding:40px 0; text-align:center;}
  .loading-note{font-family:var(--mono); font-size:12px; color:var(--muted); padding:20px 0;}
</style>
</head>
<body>

<div id="configWarning">
  BACKEND CONFIG belum diisi — buka file ini, isi SUPABASE_URL &amp; SUPABASE_ANON_KEY di bagian atas script (nilainya sama seperti yang kamu isi di index.html).
</div>

<!-- ---------- LOGIN ---------- -->
<div id="loginScreen">
  <div class="login-box">
    <h1>duftlab</h1>
    <div class="sub">Admin Access</div>
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Log In</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ---------- ADMIN SHELL ---------- -->
<div id="adminShell">
  <header>
    <div class="logo">duft<span>lab</span> — admin</div>
    <button id="logoutBtn">Log Out</button>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="catalog">Catalog</button>
    <button class="tab-btn" data-tab="leads">Quiz Leads</button>
    <button class="tab-btn" data-tab="clicks">Click Stats</button>
  </div>

  <main>
    <!-- CATALOG -->
    <div class="panel active" id="panel-catalog">
      <div class="loading-note" id="catalogLoading">Loading catalog…</div>
      <div class="cat-grid" id="catalogGrid"></div>
    </div>

    <!-- QUIZ LEADS -->
    <div class="panel" id="panel-leads">
      <div class="toolbar">
        <div class="loading-note" id="leadsCount">Loading…</div>
        <button id="exportLeadsBtn">Export CSV</button>
      </div>
      <table id="leadsTable">
        <thead><tr><th>Name</th><th>Instagram</th><th>Email</th><th>Matched</th><th>Date</th></tr></thead>
        <tbody id="leadsBody"></tbody>
      </table>
    </div>

    <!-- CLICK STATS -->
    <div class="panel" id="panel-clicks">
      <div class="loading-note" id="clicksLoading">Loading…</div>
      <div id="clicksList"></div>
    </div>
  </main>
</div>

<script>
/* ============================================================
   BACKEND CONFIG — same values as in index.html's BACKEND CONFIG
   ============================================================ */
const SUPABASE_URL      = 'https://msjwbkhqsgmuxhrxrsgl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_eAWXRiXohQc9OmY5GuMilg_43XE1--u';

if (!SUPABASE_URL || !SUPABASE_ANON_KEY){
  document.getElementById('configWarning').style.display = 'block';
}

const sb = (SUPABASE_URL && SUPABASE_ANON_KEY)
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

/* ---------- LOGIN ---------- */
const loginScreen = document.getElementById('loginScreen');
const adminShell = document.getElementById('adminShell');
const loginError = document.getElementById('loginError');

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin(){
  if (!sb){ loginError.textContent = 'Backend belum dikonfigurasi.'; return; }
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  loginError.textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error){ loginError.textContent = error.message; return; }
  showAdmin();
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.reload();
});

async function checkSession(){
  if (!sb) return;
  const { data } = await sb.auth.getSession();
  if (data.session) showAdmin();
}

function showAdmin(){
  loginScreen.style.display = 'none';
  adminShell.style.display = 'block';
  loadCatalog();
  loadLeads();
  loadClicks();
}

/* ---------- TABS ---------- */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

/* ---------- CATALOG ---------- */
async function loadCatalog(){
  const grid = document.getElementById('catalogGrid');
  const loading = document.getElementById('catalogLoading');
  const { data, error } = await sb.from('catalog_items').select('*').order('sort_order');
  loading.style.display = 'none';
  if (error){ grid.innerHTML = `<div class="empty-note">Gagal load katalog: ${error.message}</div>`; return; }
  if (!data.length){ grid.innerHTML = `<div class="empty-note">Belum ada data. Jalankan supabase-admin-setup.sql dulu.</div>`; return; }
  grid.innerHTML = '';
  data.forEach(item => grid.appendChild(renderCatalogCard(item)));
}

function renderCatalogCard(item){
  const card = document.createElement('div');
  card.className = 'cat-card';
  const photoSrc = item.photo_url && item.photo_url.startsWith('http')
    ? item.photo_url
    : (item.photo_url || '');
  card.innerHTML = `
    <div class="cat-photo-wrap">
      <img class="cat-photo" src="${photoSrc}" alt="${item.name || item.n}" onerror="this.style.opacity=0.2">
      <input type="file" accept="image/*" class="photo-input">
    </div>
    <div class="cat-fields">
      <div class="full"><span class="field-label">Index — ${item.n} (${item.series})</span></div>
      <div><span class="field-label">Name</span><input data-f="name" value="${esc(item.name)}"></div>
      <div><span class="field-label">Price</span><input data-f="price" value="${esc(item.price)}"></div>
      <div><span class="field-label">Size</span><input data-f="size" value="${esc(item.size)}"></div>
      <div><span class="field-label">Type</span><input data-f="type" value="${esc(item.type)}"></div>
      <div><span class="field-label">Stock</span><input data-f="stock" value="${esc(item.stock)}"></div>
      <div><label class="chk"><input type="checkbox" data-f="coming_soon" ${item.coming_soon ? 'checked' : ''}> Coming Soon</label></div>
      <div class="full"><span class="field-label">Tagline</span><input data-f="line" value="${esc(item.line)}"></div>
      <div class="full"><span class="field-label">Description</span><textarea data-f="desc">${esc(item.desc)}</textarea></div>
      <div><span class="field-label">Top Notes</span><input data-f="notes_top" value="${esc(item.notes_top)}"></div>
      <div><span class="field-label">Mid Notes</span><input data-f="notes_mid" value="${esc(item.notes_mid)}"></div>
      <div><span class="field-label">Base Notes</span><input data-f="notes_base" value="${esc(item.notes_base)}"></div>
      <div class="cat-save-row">
        <button class="save-btn">Save Changes</button>
        <span class="status"></span>
      </div>
    </div>
  `;
  card.querySelector('.save-btn').addEventListener('click', () => saveCatalogItem(item.n, card));
  return card;
}

function esc(v){ return (v || '').toString().replace(/"/g, '&quot;'); }

async function saveCatalogItem(n, card){
  const status = card.querySelector('.status');
  status.className = 'status';
  status.textContent = 'Saving…';
  const updates = {};
  card.querySelectorAll('[data-f]').forEach(el => {
    updates[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
  });

  const fileInput = card.querySelector('.photo-input');
  const file = fileInput.files[0];
  if (file){
    const ext = file.name.split('.').pop();
    const path = `${n}-${Date.now()}.${ext}`;
    const { error: uploadError } = await sb.storage.from('catalog-photos').upload(path, file, { upsert: true });
    if (uploadError){
      status.className = 'status err';
      status.textContent = 'Upload foto gagal: ' + uploadError.message;
      return;
    }
    const { data: pub } = sb.storage.from('catalog-photos').getPublicUrl(path);
    updates.photo_url = pub.publicUrl;
    card.querySelector('.cat-photo').src = pub.publicUrl;
  }

  const { error } = await sb.from('catalog_items').update(updates).eq('n', n);
  if (error){
    status.className = 'status err';
    status.textContent = 'Gagal: ' + error.message;
  } else {
    status.className = 'status ok';
    status.textContent = 'Tersimpan ✓';
    setTimeout(() => { status.textContent = ''; status.className = 'status'; }, 2500);
  }
}

/* ---------- QUIZ LEADS ---------- */
let leadsCache = [];
async function loadLeads(){
  const countEl = document.getElementById('leadsCount');
  const body = document.getElementById('leadsBody');
  const { data, error } = await sb.from('quiz_leads').select('*').order('created_at', { ascending: false });
  if (error){ countEl.textContent = 'Gagal load: ' + error.message; return; }
  leadsCache = data;
  countEl.textContent = `${data.length} responses`;
  body.innerHTML = data.map(l => `
    <tr>
      <td>${esc(l.name)}</td>
      <td>${esc(l.instagram)}</td>
      <td>${esc(l.email)}</td>
      <td>${esc(l.matched_specimen)}</td>
      <td>${new Date(l.created_at).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' })}</td>
    </tr>
  `).join('') || '<tr><td colspan="5" class="empty-note">Belum ada yang isi quiz.</td></tr>';
}

document.getElementById('exportLeadsBtn').addEventListener('click', () => {
  if (!leadsCache.length){ return; }
  const headers = ['name', 'instagram', 'email', 'matched_specimen', 'created_at'];
  const rows = [headers.join(',')].concat(
    leadsCache.map(l => headers.map(h => `"${(l[h] || '').toString().replace(/"/g, '""')}"`).join(','))
  );
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `duftlab-quiz-leads-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
});

/* ---------- CLICK STATS ---------- */
async function loadClicks(){
  const loading = document.getElementById('clicksLoading');
  const list = document.getElementById('clicksList');
  const { data, error } = await sb.from('product_clicks').select('*');
  loading.style.display = 'none';
  if (error){ list.innerHTML = `<div class="empty-note">Gagal load: ${error.message}</div>`; return; }
  if (!data.length){ list.innerHTML = '<div class="empty-note">Belum ada klik tercatat.</div>'; return; }
  const withTotal = data.map(d => ({ ...d, total: (d.view_count||0) + (d.add_to_bag_count||0) + (d.request_access_count||0) }));
  withTotal.sort((a, b) => b.total - a.total);
  const max = withTotal[0].total || 1;
  list.innerHTML = withTotal.map(d => `
    <div class="stat-row">
      <div class="stat-head"><b>${esc(d.product_name || d.product_id)}</b><span>${d.total} interactions</span></div>
      <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${(d.total / max * 100).toFixed(0)}%"></div></div>
      <div class="stat-breakdown">Views: ${d.view_count||0} · Add to Bag: ${d.add_to_bag_count||0} · Request Access: ${d.request_access_count||0}</div>
    </div>
  `).join('');
}

checkSession();
</script>
</body>
</html>
